name: Remote Upload to Google Drive

                        on:
                        repository_dispatch:
                        types: [remote-upload]

                        jobs:
                        upload:
                        runs-on: ubuntu-latest

                        steps:
                        - name: Checkout
                        uses: actions/checkout@v4

                        - name: Setup Node.js
                        uses: actions/setup-node@v4
                        with:
                        node-version: '20'

                        - name: Install dependencies
                        run: npm install

                        - name: Upload to Google Drive
                        id: upload
                        env:
                        REFRESH_TOKEN: ${{ secrets[github.event.client_payload.accountKey] }}
                        PARENT_FOLDER: ${{ github.event.client_payload.parentFolderId || secrets[github.event.client_payload.parentKey] }}
                        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
                        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
                        FILENAME: ${{ github.event.client_payload.filename }}
                        URL: ${{ github.event.client_payload.url }}
                        run: |
                        node scripts/upload.js --url "$URL" --filename "$FILENAME"

                        - name: Save result
                        if: always()
                        run: |
                        mkdir -p artifacts
                        if [ -f out/result.json ]; then
                        cp out/result.json artifacts/result.json
                        fi

                        - name: Upload result artifact
                        if: always()
                        uses: actions/upload-artifact@v4
                        with:
                        name: result
                        path: artifacts/result.json
                        retention-days: 1
                        